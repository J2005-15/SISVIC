$kind: http-example
name: 'Éxito (200 OK)'
order: 1000
request:
  url: '{{base_url}}/api/auth/login'
  method: POST
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "message": "Login exitoso",
        "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.<jwt-token-aqui>",
        "user": {
          "id": 1,
          "full_name": "Nombre Usuario",
          "email": "usuario@example.com",
          "role": "admin"
        }
      }
