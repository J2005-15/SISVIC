name: Recuperar Contraseña
method: POST
url: "{{base_url}}/api/auth/recover-password"
order: 3000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "julieth20051506@gmail.com"
    }
